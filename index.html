<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="國中生版 AI 大頭貼指令產生器：把關鍵字字塊拖進句子，一次得到中文與英文兩種提示詞。">
<title>提示詞排版台</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#E7E8EC;
  --card:#FFFFFF;
  --card-2:#F3F4F7;
  --ink:#191C22;
  --ink-2:#464C58;
  --ink-3:#6F7684;
  --rule:#CDD0D8;
  --rule-2:#DFE1E7;
  --slot-empty:#C9CCD5;
  --focus:#34549C;
  --alert:#B03A26;
  --c-subject:#2B303B;
  --c-look:#8A5320;
  --c-outfit:#5A6A1C;
  --c-expression:#A23B55;
  --c-style:#34549C;
  --c-background:#2A6152;
  --c-framing:#1D6A76;
  --c-light:#946510;
  --c-palette:#7A3E6C;
  --c-quality:#4E5866;
  --c-product:#2B303B;
  --c-filter:#1F5F86;
  --c-feature:#A23B55;
  --c-shape:#5A6A1C;
  --c-material:#8A5320;
  --c-scene:#2A6152;
  --c-user:#B03A26;
  --c-genre:#2B303B;
  --c-hero:#A23B55;
  --c-world:#2A6152;
  --c-good:#946510;
  --c-bad:#B03A26;
  --c-powerup:#1F5F86;
  --c-mechanic:#1D6A76;
  --c-feedback:#7A3E6C;
  --c-motive:#1D6A76;
  --c-rules:#4E5866;
  --c-motion:#1F5F86;
  --c-role:#34549C;
  --c-task:#2B303B;
  --c-about:#2A6152;
  --c-tone:#7A3E6C;
  --c-format:#8A5320;
  --c-limit:#4E5866;
  --shadow:0 1px 0 rgba(25,28,34,.06), 0 6px 18px -12px rgba(25,28,34,.4);
  --f-display:"Archivo","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","Archivo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#131519;--card:#1C1F26;--card-2:#23272F;
    --ink:#E9EAEE;--ink-2:#B2B8C4;--ink-3:#8A91A0;
    --rule:#343A45;--rule-2:#2A2F38;--slot-empty:#3A414C;
    --focus:#8FAAE8;--alert:#E97B63;
    --c-subject:#C3CAD8;--c-look:#D7A466;--c-outfit:#B5C46A;--c-expression:#EE8FA6;
    --c-style:#8FAAE8;--c-background:#6EC0A8;--c-framing:#62BFCB;--c-light:#E0B95F;
    --c-palette:#D28CC2;--c-quality:#A3AEBE;--c-product:#C3CAD8;--c-filter:#6FB6E2;--c-feature:#EE8FA6;--c-shape:#B5C46A;--c-material:#D7A466;--c-scene:#6EC0A8;--c-user:#E97B63;--c-genre:#C3CAD8;--c-hero:#EE8FA6;--c-world:#6EC0A8;--c-good:#E0B95F;--c-bad:#E97B63;--c-powerup:#6FB6E2;--c-mechanic:#62BFCB;--c-feedback:#D28CC2;--c-motive:#62BFCB;--c-rules:#A3AEBE;--c-motion:#6FB6E2;
    --c-role:#8FAAE8;--c-task:#C3CAD8;--c-about:#6EC0A8;--c-tone:#D28CC2;--c-format:#D7A466;--c-limit:#A3AEBE;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -16px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#131519;--card:#1C1F26;--card-2:#23272F;
  --ink:#E9EAEE;--ink-2:#B2B8C4;--ink-3:#8A91A0;
  --rule:#343A45;--rule-2:#2A2F38;--slot-empty:#3A414C;
  --focus:#8FAAE8;--alert:#E97B63;
  --c-subject:#C3CAD8;--c-look:#D7A466;--c-outfit:#B5C46A;--c-expression:#EE8FA6;
  --c-style:#8FAAE8;--c-background:#6EC0A8;--c-framing:#62BFCB;--c-light:#E0B95F;
  --c-palette:#D28CC2;--c-quality:#A3AEBE;--c-product:#C3CAD8;--c-filter:#6FB6E2;--c-feature:#EE8FA6;--c-shape:#B5C46A;--c-material:#D7A466;--c-scene:#6EC0A8;--c-user:#E97B63;--c-genre:#C3CAD8;--c-hero:#EE8FA6;--c-world:#6EC0A8;--c-good:#E0B95F;--c-bad:#E97B63;--c-powerup:#6FB6E2;--c-mechanic:#62BFCB;--c-feedback:#D28CC2;--c-motive:#62BFCB;--c-rules:#A3AEBE;--c-motion:#6FB6E2;
  --c-role:#8FAAE8;--c-task:#C3CAD8;--c-about:#6EC0A8;--c-tone:#D28CC2;--c-format:#D7A466;--c-limit:#A3AEBE;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -16px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px 72px}

/* header */
.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 28px;padding:26px 0 16px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1.1}
.brand .sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.masthead p{margin:0;color:var(--ink-2);font-size:14px;max-width:46ch}
.modes{display:flex;margin-left:auto;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--card)}
.modes button{font-size:13.5px;font-weight:500;padding:9px 15px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--rule)}
.modes button:last-child{border-right:0}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.modes button:hover:not([aria-pressed="true"]){background:var(--card-2)}

/* formula */
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:16px 0 18px;border-bottom:1px solid var(--rule)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.formula .eyebrow{margin-right:6px}
.fchip{font-family:var(--f-body);font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:2px;color:var(--card);white-space:nowrap}
.plus{color:var(--ink-3);font-family:var(--f-mono);font-size:13px}

/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:26px;padding-top:26px;align-items:start}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow)}
@media (min-width:941px){.cols>.panel.lex{position:sticky;top:16px}}
@media (max-width:940px){.cols{grid-template-columns:1fr}}
.panel-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule-2)}
.panel-hd h2{font-family:var(--f-display);font-size:14px;font-weight:600;margin:0;letter-spacing:.02em;white-space:nowrap}
.panel-hd .hint{font-size:12px;color:var(--ink-3);text-align:right}

/* template bar */
.tplbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--rule-2)}
.tplbar .tools{display:flex;gap:6px;margin-left:auto}
.pill{font-size:12.5px;padding:5px 11px;cursor:pointer;background:var(--card-2);border:1px solid var(--rule-2);border-radius:2px;color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pill:hover:not([aria-pressed="true"]){border-color:var(--ink-3);color:var(--ink)}

/* board */
.board{padding:22px 18px 20px;font-size:18px;line-height:2.4}
.board .lead{color:var(--ink-2)}
.slot{
  display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;vertical-align:baseline;
  font-size:15.5px;line-height:1.45;min-width:104px;padding:5px 11px;margin:0 3px;
  border:1px dashed var(--slot-empty);border-bottom-width:2px;border-radius:2px;
  background:transparent;cursor:pointer;text-align:left;
  transition:background .12s ease,border-color .12s ease;
}
.slot .cat{font-weight:500}
.slot .opt{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.slot:hover{border-color:currentColor}
.slot.filled{border-style:solid;border-color:currentColor;background:color-mix(in srgb, currentColor 9%, transparent)}
.slot.active{border-style:solid;border-color:currentColor;box-shadow:0 0 0 2px var(--card),0 0 0 4px currentColor}
.slot.drop{background:color-mix(in srgb, currentColor 18%, transparent)}
.slot.dim{opacity:.3}
.tok{display:inline-flex;align-items:baseline;gap:6px}
.tok+.tok::before{content:"+";font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-right:4px}
.tok .zh{color:var(--ink);font-weight:500}
.tok .en{font-family:var(--f-mono);font-size:12px;color:currentColor}
.tok .en.missing{color:var(--alert)}

/* inspector */
.insp{border-top:1px solid var(--rule-2);background:var(--card-2);padding:14px 16px}
.insp-empty{margin:0;font-size:13px;color:var(--ink-3)}
.insp-hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:10px}
.insp-hd .t{font-size:13.5px;font-weight:500}
.insp-hd .m{font-size:12px;color:var(--ink-3)}
.insp-hd .tools{display:flex;gap:6px;margin-left:auto}
.rows{display:grid;gap:8px}
.row,.row-hd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) 34px;gap:8px;align-items:center}
.row-hd span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.row input{width:100%;min-width:0;font-size:14px;padding:7px 9px;border:1px solid var(--rule);border-radius:2px;background:var(--card);color:var(--ink)}
.row input.en{font-family:var(--f-mono);font-size:12.5px}
.row input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 1px var(--focus)}
.rm{height:34px;border:1px solid var(--rule);border-radius:2px;background:var(--card);color:var(--ink-3);cursor:pointer;font-family:var(--f-mono)}
.rm:hover{color:var(--alert);border-color:var(--alert)}
.insp-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px}
.insp-foot .note{font-size:12px;color:var(--ink-3)}

/* outputs */
.outs{border-top:1px solid var(--rule-2);padding:16px;display:grid;gap:16px}
.outs-hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ofield .lbl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px}
.ofield .lbl .name{font-size:13px;font-weight:700}
.ofield .lbl .for{font-size:12px;color:var(--ink-3)}
.ofield .lbl .btn{margin-left:auto}
.ofield textarea{
  display:block;width:100%;min-height:96px;resize:vertical;font-size:14px;line-height:1.75;
  background:var(--card-2);border:1px solid var(--rule-2);border-radius:2px;padding:10px 12px;color:var(--ink);
}
.ofield textarea.en{font-family:var(--f-mono);font-size:13px}
.ofield textarea:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 1px var(--focus)}
.edited{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;font-size:12px;color:var(--alert)}
.link{border:0;background:none;padding:0;color:var(--focus);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:12px}
.btn{font-size:13px;font-weight:500;padding:7px 13px;cursor:pointer;border-radius:2px;border:1px solid var(--rule);background:var(--card-2);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.88}
.btn.sm{font-size:12.5px;padding:5px 10px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* lexicon */
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:1px solid var(--rule-2)}
.cats button{font-size:12.5px;padding:5px 10px;cursor:pointer;border-radius:2px;background:transparent;border:1px solid var(--rule-2);display:inline-flex;align-items:center;gap:6px}
.cats button .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.cats button .nm{color:var(--ink-2)}
.cats button[aria-pressed="true"]{background:var(--card-2);border-color:currentColor}
.cats button[aria-pressed="true"] .nm{color:var(--ink);font-weight:500}
.cats button:hover{border-color:var(--ink-3)}
.tray{display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:16px;max-height:min(460px, calc(100vh - 290px));min-height:180px;overflow-y:auto}
.chip{
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 11px;cursor:grab;text-align:left;
  background:var(--card-2);border:1px solid var(--rule-2);border-left:3px solid currentColor;border-radius:2px;
  transition:background .12s ease,border-color .12s ease,transform .12s ease;
}
.chip:hover{background:var(--card);border-color:var(--rule);border-left-color:currentColor;transform:translateY(-1px)}
.chip:active{cursor:grabbing}
.chip.used{background:color-mix(in srgb, currentColor 12%, var(--card));border-color:currentColor}
.chip.used .zh::after{content:"  ✓";font-family:var(--f-mono);font-size:11px;color:currentColor}
.chip .zh{font-size:13.5px;color:var(--ink);font-weight:500;line-height:1.3}
.chip .en{font-family:var(--f-mono);font-size:11px;color:currentColor}
.tip{padding:11px 16px;border-top:1px solid var(--rule-2);font-size:12.5px;color:var(--ink-2);background:var(--card-2);min-height:62px}
.tip b{color:var(--ink);font-weight:500}

/* lessons */
.lessons{margin-top:34px;border-top:2px solid var(--ink);padding-top:22px}
.lessons h2{font-family:var(--f-display);font-size:16px;margin:0 0 4px;font-weight:600;text-wrap:balance}
.lessons .note{color:var(--ink-3);font-size:13px;margin:0 0 18px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px 30px}
.lesson .eyebrow{display:block;margin-bottom:2px}
.lesson h3{font-size:14px;margin:0 0 5px;font-weight:700;text-wrap:balance}
.lesson p{margin:0;font-size:13.5px;color:var(--ink-2);max-width:60ch}
.lesson code{font-family:var(--f-body);font-size:12.5px;background:var(--card);border:1px solid var(--rule-2);padding:1px 5px;border-radius:2px;white-space:nowrap}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3);max-width:80ch}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;padding:9px 16px;border-radius:2px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:10}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media (max-width:620px){
  .wrap{padding:0 14px 56px}
  .masthead{padding-top:20px}
  .brand h1{font-size:22px}
  .modes{margin-left:0;width:100%}
  .modes button{flex:1;padding:9px 6px}
  .panel-hd .hint{display:none}
  .board{font-size:16px;line-height:2.15;padding:18px 14px}
  .slot{min-width:84px;padding:4px 9px;font-size:14.5px}
  .tok{flex-direction:column;gap:0}
  .tok+.tok::before{display:none}
  .tok .en{font-size:11px;line-height:1.3}
  .row,.row-hd{grid-template-columns:1fr 34px}
  .row input.en{grid-column:1;grid-row:2}
  .row .rm{grid-row:1 / span 2;grid-column:2;height:100%}
  .row-hd span:nth-child(2){display:none}
  .tray{max-height:340px}
}
</style>
<style>
.themes{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;padding:16px 0 0}
.themes .eyebrow{align-self:center;margin-right:4px}
.theme{
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:160px;
  padding:8px 16px;border:1px solid var(--rule);border-radius:2px;background:var(--card);cursor:pointer;text-align:left;
}
.theme .nm{font-size:15px;font-weight:700;color:var(--ink);line-height:1.35}
.theme[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.theme[aria-pressed="true"] .nm{color:var(--paper)}
.theme:hover:not([aria-pressed="true"]){border-color:var(--ink-3)}
@media (max-width:620px){
  .themes .eyebrow{width:100%}
  .theme{flex:1;min-width:0;padding:7px 12px}
  .theme .nm{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <h1>提示詞排版台</h1>
      <span class="sub" id="sub"></span>
    </div>
    <p id="lede"></p>
    <div class="modes" id="modes" role="group" aria-label="要產生什麼"></div>
  </header>

  <div class="themes" id="themes" role="group" aria-label="主題"></div>

  <div class="formula" id="formula"></div>

  <div class="cols">
    <section class="panel">
      <div class="panel-hd">
        <h2>排版盤</h2>
        <span class="hint">點一格選它，再點右邊的字塊；或直接把字塊拖進來</span>
      </div>
      <div class="tplbar">
        <div id="tpl" role="group" aria-label="句型" style="display:flex;flex-wrap:wrap;gap:6px"></div>
        <div class="tools">
          <button type="button" class="btn sm" id="dice">隨機排一組</button>
          <button type="button" class="btn sm" id="sample">放回範例</button>
          <button type="button" class="btn sm" id="clear">全部清空</button>
        </div>
      </div>
      <div class="board" id="board"></div>
      <div class="insp" id="insp"></div>
      <div class="outs">
        <div class="outs-hd">
          <span class="eyebrow">排好的指令</span>
          <span class="eyebrow" id="count"></span>
        </div>
        <div class="ofield">
          <div class="lbl">
            <label class="name" for="out-zh">繁體中文</label>
            <span class="for" id="for-zh"></span>
            <button type="button" class="btn primary sm" data-copy="zh">複製中文</button>
          </div>
          <textarea id="out-zh" rows="4" spellcheck="false"></textarea>
          <div class="edited" id="ed-zh" hidden>你手動改過這一欄，排版盤的變更不會蓋掉它。<button type="button" class="link" data-regen="zh">用排版盤重新產生</button></div>
        </div>
        <div class="ofield">
          <div class="lbl">
            <label class="name" for="out-en">English</label>
            <span class="for" id="for-en"></span>
            <button type="button" class="btn primary sm" data-copy="en">複製英文</button>
          </div>
          <textarea id="out-en" class="en" rows="4" spellcheck="false"></textarea>
          <div class="edited" id="ed-en" hidden>你手動改過這一欄，排版盤的變更不會蓋掉它。<button type="button" class="link" data-regen="en">用排版盤重新產生</button></div>
        </div>
      </div>
    </section>

    <section class="panel lex">
      <div class="panel-hd">
        <h2>字盤</h2>
        <span class="hint" id="trayHint"></span>
      </div>
      <div class="cats" id="cats" role="group" aria-label="關鍵字分類"></div>
      <div class="tray" id="tray"></div>
      <div class="tip" id="tip" aria-live="polite"></div>
    </section>
  </div>

  <section class="lessons">
    <h2 id="lessons-title"></h2>
    <p class="note">上面排出來的每一句，都用到了這四件事。</p>
    <div class="lgrid" id="lessons"></div>

<script>
(function(){
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const trim = (s)=>String(s||"").trim();
const MAX = 4, KEY = "prompt-blocks-v2";
THEMES.forEach((th)=>{ Object.keys(th.lex).forEach((c)=>{ th.lex[c]=th.lex[c].map((a)=>({en:a[0],zh:a[1],tip:a[2]})); }); });

const noDot = (s)=>s.replace(/[.。\s]+$/,"");
const dot = (s)=>/[.!?。！？]$/.test(s) ? s : s+".";
const SENT_CATS = ["task","about","limit","rules"];
const EN_WRAP = {
  role:(s)=>"You are "+noDot(s)+".",
  task:(s)=>s,
  about:(s)=>"About me: "+s,
  user:(s)=>"It is designed for "+noDot(s)+".",
  tone:(s)=>"Tone: "+noDot(s)+".",
  format:(s)=>"Format: "+noDot(s)+".",
  limit:(s)=>s,
  genre:(s)=>"Please build "+noDot(s)+" as one single HTML file, with CSS inside a <style> tag and JavaScript inside a <script> tag.",
  hero:(s)=>"The player is "+noDot(s)+".",
  motive:(s)=>"Story: the player is trying "+noDot(s)+".",
  world:(s)=>"The game takes place in "+noDot(s)+".",
  good:(s)=>"Collect "+noDot(s)+".",
  bad:(s)=>"Avoid "+noDot(s)+".",
  powerup:(s)=>"Power-ups: "+noDot(s)+".",
  mechanic:(s)=>"Game rules: "+noDot(s)+".",
  feedback:(s)=>"Also include "+noDot(s)+".",
  rules:(s)=>s
};

const state = {theme:THEMES[0], imageTheme:THEMES[0], mode:MODES[0], tpl:THEMES[0].modes.image[0], fills:{}, active:null, cat:null, manual:{zh:null,en:null}, mem:{}};
const CAT = (c)=>state.theme.cats[c];
const LEX = (c)=>state.theme.lex[c];

/* ---------- helpers ---------- */
function items(i){ return (state.fills[i]||[]).filter((it)=>trim(it.zh)||trim(it.en)); }
function color(cat){ return "var(--c-"+cat+")"; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function catsOf(tpl){ const out=[]; tpl.parts.forEach((p)=>{ if(!out.includes(p.cat)) out.push(p.cat); }); return out; }
function tplsNow(){ return state.theme.modes[state.mode.id]; }
function themeFor(m, imageTheme){ return m.id==="image" ? imageTheme : THEMES.find((x)=>x.id===m.theme); }
function seedFills(tpl){
  const f={};
  (tpl.seed||[]).forEach((arr,i)=>{
    if(arr && arr.length) f[i]=arr.map((k)=>{ const it=LEX(tpl.parts[i].cat)[k]; return {zh:it.zh,en:it.en}; });
  });
  return f;
}
function sanitize(f,tpl){
  const out={};
  if(!f || typeof f!=="object") return out;
  Object.keys(f).forEach((k)=>{
    const n=+k;
    if(Number.isInteger(n) && n>=0 && n<tpl.parts.length && Array.isArray(f[k])){
      out[n]=f[k].filter((x)=>x && typeof x==="object").slice(0,MAX).map((x)=>({zh:String(x.zh||""),en:String(x.en||"")}));
    }
  });
  return out;
}
function prune(){
  Object.keys(state.fills).forEach((k)=>{ const a=items(k); if(a.length) state.fills[k]=a; else delete state.fills[k]; });
}
function setActive(i){
  if(state.active!==i) prune();
  state.active=i;
  if(i!=null) state.cat=state.tpl.parts[i].cat;
}
function save(){
  try{
    const mem=Object.assign({}, state.mem); mem[state.tpl.id]=state.fills;
    localStorage.setItem(KEY, JSON.stringify({theme:state.imageTheme.id, mode:state.mode.id, tpl:state.tpl.id, mem}));
  }catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!d) return false;
    const it=THEMES.find((x)=>x.id===d.theme)||THEMES[0], m=MODES.find((x)=>x.id===d.mode);
    const th=m && themeFor(m, it);
    const list=th && th.modes[m.id];
    if(!list || !list.length) return false;
    const t=list.find((x)=>x.id===d.tpl) || list[0];
    state.imageTheme=it; state.theme=th; state.mode=m; state.tpl=t;
    state.mem=(d.mem && typeof d.mem==="object") ? d.mem : {};
    state.fills = state.mem[t.id]!==undefined ? sanitize(state.mem[t.id],t) : seedFills(t);
    return true;
  }catch(e){ return false; }
}

/* ---------- prompt text ---------- */
function gen(){
  const tpl=state.tpl, sentence=state.mode.join==="sentence";
  let zh="", filled=0; const en=[];
  tpl.parts.forEach((p,i)=>{
    const its=items(i), cz=CAT(p.cat).zh;
    if(!its.length){
      if(p.opt) return;
      zh+=p.pre+"［"+cz+"］"+p.post; en.push("["+cz+"]"); return;
    }
    filled++;
    zh+=p.pre+its.map((it)=>trim(it.zh)||trim(it.en)).join("、")+p.post;
    let ens=its.map((it)=>trim(it.en)||trim(it.zh));
    if(sentence){
      const sent=SENT_CATS.includes(p.cat);
      if(sent) ens=ens.map(dot);
      en.push((EN_WRAP[p.cat]||((s)=>s))(ens.join(sent?" ":", ")));
    } else en.push(ens.join(", "));
  });
  zh=zh.replace(/[，、：\s]+$/,"");
  if(zh && !/[。！？]$/.test(zh)) zh+="。";
  const enText = sentence ? en.join(" ") : [tpl.head].concat(en).join(", ");
  return {zh, en:enText, filled, total:tpl.parts.length};
}

/* ---------- render ---------- */
function renderHeader(){
  const th=state.theme;
  $("sub").textContent=th.zh;
  $("lede").textContent=th.lede;
  $("modes").innerHTML = MODES.map((m)=>
    '<button type="button" data-m="'+m.id+'" aria-pressed="'+(m===state.mode)+'">'+m.zh+'</button>').join("");
  $("themes").innerHTML = '<span class="eyebrow">主題</span>' + THEMES.filter((x)=>x.modes.image).map((x)=>
    '<button type="button" class="theme" data-th="'+x.id+'" aria-pressed="'+(x===th)+'"><span class="nm">'+x.zh+'</span></button>').join("");
  $("themes").hidden = state.mode.id!=="image";
  $("lessons-title").textContent=th.lessonsTitle;
  $("lessons").innerHTML = th.lessons.map((l)=>
    '<div class="lesson"><span class="eyebrow">'+l[0]+'</span><h3>'+l[1]+'</h3><p>'+l[2]+'</p></div>').join("");
  document.title="提示詞排版台 · "+th.zh;
}
function renderFormula(){
  $("formula").innerHTML = '<span class="eyebrow">句子的骨架</span>' + catsOf(state.tpl).map((c,i)=>
    (i?'<span class="plus">+</span>':'')+'<span class="fchip" style="background:'+color(c)+'">'+CAT(c).zh+'</span>').join("");
}
function renderTpl(){
  $("tpl").innerHTML = tplsNow().map((t)=>
    '<button type="button" class="pill" data-t="'+t.id+'" aria-pressed="'+(t===state.tpl)+'">'+t.zh+'</button>').join("");
}
function renderBoard(){
  let h="";
  state.tpl.parts.forEach((p,i)=>{
    const its=items(i), c=CAT(p.cat);
    if(p.pre) h+='<span class="lead">'+esc(p.pre)+'</span>';
    let inner, label;
    if(its.length){
      inner=its.map((it)=>{
        const e=trim(it.en), z=trim(it.zh);
        return '<span class="tok"><span class="zh">'+esc(z||e)+'</span><span class="en'+(e?'':' missing')+'">'+esc(e||"還沒有英文")+'</span></span>';
      }).join("");
      label=c.zh+"："+its.map((it)=>trim(it.zh)||trim(it.en)).join("、");
    } else {
      inner='<span class="cat">'+c.zh+'</span>'+(c.multi?'<span class="opt">可多選</span>':'')+(p.opt?'<span class="opt">可省略</span>':'');
      label=c.zh+"，還沒填";
    }
    const cls="slot"+(its.length?" filled":"")+(state.active===i?" active":"");
    h+='<button type="button" class="'+cls+'" data-slot="'+i+'" data-cat="'+p.cat+'" style="color:'+color(p.cat)+'" aria-pressed="'+(state.active===i)+'" aria-label="'+esc(label)+'">'+inner+'</button>';
    if(p.post) h+='<span class="lead">'+esc(p.post)+'</span>';
  });
  $("board").innerHTML=h;
}
function renderInsp(){
  const el=$("insp"), i=state.active;
  if(i==null){
    el.innerHTML='<p class="insp-empty">想改字嗎？點排版盤上的任何一格，就能在這裡修改中文和英文，或寫進自己想到的詞。</p>';
    return;
  }
  const p=state.tpl.parts[i], c=CAT(p.cat), ex=LEX(p.cat)[0];
  if(!state.fills[i]) state.fills[i]=[];
  const arr=state.fills[i];
  if(!arr.length) arr.push({zh:"",en:""});
  let h='<div class="insp-hd"><span class="fchip" style="background:'+color(p.cat)+'">'+c.zh+'</span>'+
    '<span class="t">正在改這一格</span><span class="m">'+(c.multi?'可以放 1 到 '+MAX+' 個詞':'只放一個詞')+'</span>'+
    '<span class="tools"><button type="button" class="btn sm" data-act="empty">清空這格</button>'+
    '<button type="button" class="btn sm" data-act="done">改好了</button></span></div>';
  h+='<div class="rows"><div class="row-hd" aria-hidden="true"><span>中文</span><span>English</span><span></span></div>';
  arr.forEach((it,k)=>{
    h+='<div class="row" data-r="'+k+'">'+
      '<input class="zh" data-f="zh" value="'+esc(it.zh)+'" placeholder="例如：'+esc(ex.zh)+'" aria-label="中文，第 '+(k+1)+' 個詞">'+
      '<input class="en" data-f="en" value="'+esc(it.en)+'" placeholder="e.g. '+esc(ex.en)+'" aria-label="英文，第 '+(k+1)+' 個詞" spellcheck="false">'+
      '<button type="button" class="rm" data-rm="'+k+'" aria-label="刪掉第 '+(k+1)+' 個詞">×</button></div>';
  });
  h+='</div><div class="insp-foot">'+
    (c.multi?'<button type="button" class="btn sm" data-act="add"'+(arr.length>=MAX?' disabled':'')+'>＋ 自己寫一個</button>':'')+
    '<span class="note">英文不會寫可以先空著，英文指令會暫時放中文。</span></div>';
  el.innerHTML=h;
}
function renderCats(){
  const cs=catsOf(state.tpl);
  if(!cs.includes(state.cat)) state.cat=cs[0];
  $("cats").innerHTML = cs.map((c)=>
    '<button type="button" data-c="'+c+'" aria-pressed="'+(c===state.cat)+'" style="color:'+color(c)+'"><span class="dot"></span><span class="nm">'+CAT(c).zh+'</span></button>').join("");
}
function renderTray(){
  const c=state.cat, used=[];
  state.tpl.parts.forEach((p,i)=>{ if(p.cat===c) items(i).forEach((it)=>used.push(trim(it.zh)+"|"+trim(it.en))); });
  $("tray").innerHTML = LEX(c).map((it,idx)=>{
    const u=used.includes(it.zh+"|"+it.en);
    return '<button type="button" class="chip'+(u?' used':'')+'" draggable="true" data-i="'+idx+'" style="color:'+color(c)+'" aria-pressed="'+u+'">'+
      '<span class="zh">'+esc(it.zh)+'</span><span class="en">'+esc(it.en)+'</span></button>';
  }).join("");
  $("trayHint").textContent = LEX(c).length+" 個「"+CAT(c).zh+"」，"+(CAT(c).multi?"可以選好幾個":"選一個");
  showTip(null);
}
function showTip(it){
  $("tip").innerHTML = it ? '<b>'+esc(it.zh)+'</b>　'+esc(it.tip) : '<b>'+CAT(state.cat).zh+'</b>　'+CAT(state.cat).tip;
}
function renderOutput(){
  const g=gen();
  ["zh","en"].forEach((k)=>{
    const ta=$("out-"+k);
    if(state.manual[k]==null && ta.value!==g[k]) ta.value=g[k];
    $("ed-"+k).hidden = state.manual[k]==null;
  });
  $("count").textContent="已填 "+g.filled+" / "+g.total+" 格";
  $("for-zh").textContent=state.mode.forZh;
  $("for-en").textContent=state.mode.forEn;
}
function renderAll(){ renderHeader(); renderFormula(); renderTpl(); renderBoard(); renderInsp(); renderCats(); renderTray(); renderOutput(); }
function refresh(){ renderBoard(); renderInsp(); renderCats(); renderTray(); renderOutput(); save(); }

/* ---------- actions ---------- */
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer=setTimeout(()=>t.classList.remove("show"),2200);
}
function fill(cat,it,target){
  const parts=state.tpl.parts;
  const cands=parts.map((p,i)=>i).filter((i)=>parts[i].cat===cat);
  if(!cands.length){ toast("這個句型沒有「"+CAT(cat).zh+"」這一格"); return; }
  if(target==null){
    if(state.active!=null && parts[state.active].cat===cat) target=state.active;
    else { const e=cands.find((i)=>!items(i).length); target = e!==undefined ? e : cands[0]; }
  }
  setActive(target);
  let arr=items(target);
  const k=arr.findIndex((x)=>trim(x.zh)===it.zh && trim(x.en)===it.en);
  if(CAT(cat).multi){
    if(k>=0) arr.splice(k,1);
    else if(arr.length>=MAX) toast("這一格最多放 "+MAX+" 個詞，先刪掉一個再加");
    else arr.push({zh:it.zh,en:it.en});
  } else {
    arr=[{zh:it.zh,en:it.en}];
  }
  state.fills[target]=arr;
  refresh();
}
/* switch to another template; theme and mode must already be set */
function loadTpl(tpl){
  state.tpl=tpl; state.active=null; state.manual={zh:null,en:null};
  state.fills = state.mem[tpl.id]!==undefined ? sanitize(state.mem[tpl.id],tpl) : seedFills(tpl);
  renderAll(); save();
}
function stash(){ prune(); state.mem[state.tpl.id]=clone(state.fills); }
function copyText(txt,name){
  if(!trim(txt)){ toast("這一欄是空的，還沒有東西可以複製"); return; }
  const gap = /［[^］]*］|\[[一-鿿]+\]/.test(txt);
  const done=()=>toast(gap ? "已複製"+name+"，但還有空格沒填，貼上前記得補完" : "已複製"+name+"，貼到 AI 工具就能用");
  const fallback=()=>{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(err){ toast("沒辦法自動複製，請在欄位裡全選後手動複製"); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,fallback);
  else fallback();
}

/* ---------- events ---------- */
$("modes").addEventListener("click",(e)=>{
  const b=e.target.closest("button[data-m]"); if(!b) return;
  const m=MODES.find((x)=>x.id===b.dataset.m); if(m===state.mode) return;
  stash(); state.mode=m; state.theme = themeFor(m, state.imageTheme); state.cat=null; loadTpl(tplsNow()[0]);
});
$("themes").addEventListener("click",(e)=>{
  const b=e.target.closest("button[data-th]"); if(!b) return;
  const th=THEMES.find((x)=>x.id===b.dataset.th); if(th===state.theme) return;
  stash(); state.theme=th; state.imageTheme=th; state.cat=null; loadTpl(tplsNow()[0]);
});
$("tpl").addEventListener("click",(e)=>{
  const b=e.target.closest("button[data-t]"); if(!b) return;
  const t=tplsNow().find((x)=>x.id===b.dataset.t); if(t!==state.tpl){ stash(); loadTpl(t); }
});
$("cats").addEventListener("click",(e)=>{
  const b=e.target.closest("button[data-c]"); if(!b) return;
  state.cat=b.dataset.c; renderCats(); renderTray();
});
$("board").addEventListener("click",(e)=>{
  const b=e.target.closest("button[data-slot]"); if(!b) return;
  setActive(+b.dataset.slot); refresh();
});
$("tray").addEventListener("click",(e)=>{
  const b=e.target.closest("button[data-i]"); if(!b) return;
  fill(state.cat, LEX(state.cat)[+b.dataset.i]);
});
const tipFrom=(e)=>{ const b=e.target.closest("button[data-i]"); if(b) showTip(LEX(state.cat)[+b.dataset.i]); };
$("tray").addEventListener("pointerover",tipFrom);
$("tray").addEventListener("focusin",tipFrom);
$("tray").addEventListener("pointerleave",()=>showTip(null));

$("insp").addEventListener("input",(e)=>{
  const inp=e.target.closest("input[data-f]"); if(!inp || state.active==null) return;
  const arr=state.fills[state.active], k=+inp.closest(".row").dataset.r;
  if(!arr || !arr[k]) return;
  arr[k][inp.dataset.f]=inp.value;
  renderBoard(); renderOutput(); save();
});
$("insp").addEventListener("change",()=>renderTray());
$("insp").addEventListener("click",(e)=>{
  const b=e.target.closest("button"); if(!b || state.active==null) return;
  const i=state.active, arr=state.fills[i]||(state.fills[i]=[]);
  if(b.dataset.rm!=null) arr.splice(+b.dataset.rm,1);
  else if(b.dataset.act==="add"){ if(arr.length<MAX) arr.push({zh:"",en:""}); }
  else if(b.dataset.act==="empty") state.fills[i]=[];
  else if(b.dataset.act==="done") setActive(null);
  else return;
  refresh();
  if(b.dataset.act==="add"){ const ins=$("insp").querySelectorAll("input.zh"); if(ins.length) ins[ins.length-1].focus(); }
});
document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape" && state.active!=null){ setActive(null); refresh(); }
});

["zh","en"].forEach((k)=>{
  $("out-"+k).addEventListener("input",(e)=>{ state.manual[k]=e.target.value; $("ed-"+k).hidden=false; });
});
document.querySelector(".outs").addEventListener("click",(e)=>{
  const r=e.target.closest("[data-regen]");
  if(r){ state.manual[r.dataset.regen]=null; renderOutput(); toast("已經換回排版盤排出來的內容"); return; }
  const c=e.target.closest("[data-copy]");
  if(c) copyText($("out-"+c.dataset.copy).value, c.dataset.copy==="zh"?"中文":"英文");
});

/* drag and drop */
$("tray").addEventListener("dragstart",(e)=>{
  const b=e.target.closest("button[data-i]"); if(!b) return;
  e.dataTransfer.setData("text/plain", state.theme.id+"|"+state.cat+"|"+b.dataset.i);
  e.dataTransfer.effectAllowed="copy";
  document.querySelectorAll("#board .slot").forEach((s)=>{ if(s.dataset.cat!==state.cat) s.classList.add("dim"); });
});
$("tray").addEventListener("dragend",()=>{
  document.querySelectorAll("#board .slot").forEach((s)=>s.classList.remove("dim","drop"));
});
$("board").addEventListener("dragover",(e)=>{
  const s=e.target.closest(".slot"); if(!s || s.dataset.cat!==state.cat) return;
  e.preventDefault(); e.dataTransfer.dropEffect="copy"; s.classList.add("drop");
});
$("board").addEventListener("dragleave",(e)=>{
  const s=e.target.closest(".slot"); if(s && !s.contains(e.relatedTarget)) s.classList.remove("drop");
});
$("board").addEventListener("drop",(e)=>{
  const s=e.target.closest(".slot"); if(!s) return;
  e.preventDefault();
  const d=(e.dataTransfer.getData("text/plain")||"").split("|"), cat=d[1], idx=+d[2];
  if(d[0]!==state.theme.id || !state.theme.lex[cat] || !state.theme.lex[cat][idx] || s.dataset.cat!==cat) return;
  fill(cat, LEX(cat)[idx], +s.dataset.slot);
});

$("dice").addEventListener("click",()=>{
  const f={};
  state.tpl.parts.forEach((p,i)=>{
    if(p.opt && Math.random()<0.4) return;
    const pool=LEX(p.cat).slice(), n=CAT(p.cat).multi ? 1+Math.floor(Math.random()*2) : 1;
    f[i]=[];
    for(let k=0;k<n && pool.length;k++){ const it=pool.splice(Math.floor(Math.random()*pool.length),1)[0]; f[i].push({zh:it.zh,en:it.en}); }
  });
  state.fills=f; state.active=null; refresh();
  toast("排好了，把不喜歡的那幾格換掉");
});
$("sample").addEventListener("click",()=>{
  state.fills=seedFills(state.tpl); state.active=null; refresh();
  toast("已經放回這個句型的範例");
});
$("clear").addEventListener("click",()=>{
  state.fills={}; state.active=null; refresh();
  toast("清空了，從右邊挑字塊開始排");
});

/* init */
if(!load()) state.fills=seedFills(state.tpl);
renderAll();
})();
</script>
</body>
